name: Bootstrap PrusaSlicer 2.9.6 source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import PrusaSlicer 2.9.6 snapshot
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --branch version_2.9.6 \
            https://github.com/prusa3d/PrusaSlicer.git \
            "$TMP_DIR/upstream"

          UPSTREAM_SHA="$(git -C "$TMP_DIR/upstream" rev-parse HEAD)"
          test "$UPSTREAM_SHA" = "b028299c770b8380ee81c921a2867d522f288123"

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            "$TMP_DIR/upstream/" ./

          cat > REINFORCED_BASE.md <<EOF
          # PrusaSlicer Reinforced base

          This independent repository was initialized from the official PrusaSlicer 2.9.6 source snapshot.

          - Upstream: https://github.com/prusa3d/PrusaSlicer
          - Upstream tag: version_2.9.6
          - Upstream commit: ${UPSTREAM_SHA}
          - Local development branch: reinforced-cut

          Upstream GitHub Actions workflow files are intentionally not imported. This repository will use its own build workflows.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "Import PrusaSlicer 2.9.6 source snapshot"
          git push origin HEAD:main
