name: Bootstrap PrusaSlicer 2.9.6 source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream PrusaSlicer 2.9.6 history
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/prusa3d/PrusaSlicer.git || true
          git fetch upstream --tags --force
          UPSTREAM_SHA="$(git rev-list -n 1 version_2.9.6)"
          echo "Upstream version_2.9.6 commit: ${UPSTREAM_SHA}"
          git push origin "${UPSTREAM_SHA}:refs/heads/main" --force
          git push origin "${UPSTREAM_SHA}:refs/heads/reinforced-cut" --force
          git push origin "refs/tags/version_2.9.6:refs/tags/upstream-version_2.9.6" --force
