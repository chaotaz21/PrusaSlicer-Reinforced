name: Build Windows Reinforced

on:
  workflow_dispatch:
  push:
    branches:
      - reinforced-cut

permissions:
  contents: read

jobs:
  build_windows:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache PrusaSlicer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\PrusaSlicer-deps
            deps\build
          key: ps-2.9.6-windows-x64-${{ hashFiles('deps/**', 'CMakeLists.txt') }}
          restore-keys: |
            ps-2.9.6-windows-x64-

      - name: Build dependencies and application
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'PrusaSlicer-deps'
          $depsCache = Join-Path $PWD 'deps\build\CMakeCache.txt'
          $installedDeps = Join-Path $deps 'usr\local'
          if ((Test-Path $depsCache) -and (Test-Path $installedDeps)) {
            cmd /c "build_win.bat -ARCH x64 -CONFIG RelWithDebInfo -STEPS all-dirty -RUN none -DESTDIR `"$deps`""
          } else {
            cmd /c "build_win.bat -ARCH x64 -CONFIG RelWithDebInfo -STEPS all -RUN none -DESTDIR `"$deps`""
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Reinforced Cut Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-Reinforced-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/src/RelWithDebInfo/**
